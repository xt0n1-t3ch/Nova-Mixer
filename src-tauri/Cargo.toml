[package]
name = "novamixer-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NovaMixer per-application volume control"

[lib]
name = "novamixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "novamixer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
novamixer-contracts = { path = "../crates/novamixer-contracts" }
audio-sessions = { path = "../crates/audio-sessions" }
novamixer-application = { path = "../crates/novamixer-application" }
settings-store = { path = "../crates/settings-store" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
parking_lot.workspace = true
dirs.workspace = true
