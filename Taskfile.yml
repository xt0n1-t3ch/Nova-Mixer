version: "3"
tasks:
  test:
    desc: Frontend Vitest plus the full Rust workspace
    cmds:
      - pnpm --filter novamixer-frontend test
      - cargo test --workspace
  test:fe:
    cmds: [pnpm --filter novamixer-frontend test]
  test:rust:
    cmds: [cargo test --workspace]
  validate:
    desc: Run the six repository validators
    cmds:
      - pnpm --filter novamixer-frontend check
      - pnpm --filter novamixer-frontend lint
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace
      - cargo xtask check-bindings
